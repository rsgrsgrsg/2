name: Code Analysis and Deploy

on:
  push:
    branches:
      - 4.x  # 승건님의 브랜치 이름에 맞게 설정 (스크린샷 보니 4.x네요!)

jobs:
  # 1. analyze-code 부분은 아예 삭제하거나 주석처리 합니다.
  # (이 부분이 없어야 에러가 안 납니다.)

  deploy:
    # 중요!! 아래 'needs' 라인이 있다면 반드시 지워야 합니다. 
    # needs: analyze-code  <- 이 줄이 있으면 analyze-code가 성공해야만 실행된다는 뜻이라 삭제 필수!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 여기에 원래 있던 배포(deploy) 관련 step들을 남겨두시면 됩니다.
      # 보통 GitHub Pages 배포 설정이 들어있을 거예요.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # 또는 index.html이 있는 폴더
