<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>류승건 & 이지연 결혼식</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=vox8crpza6"></script>
    <style>
        :root { --point-color: #D1A7A7; }
        body { font-family: 'Nanum Pen Script', cursive; margin: 0; color: #444; font-size: 1.3rem; }
        .section { padding: 40px 20px; text-align: center; }
        .btn-ui { padding: 12px 25px; border-radius: 30px; border: 1px solid #ddd; background: #fff; cursor: pointer; margin: 5px; font-family: 'Nanum Pen Script'; font-size: 1.1rem; }
        .btn-point { background: var(--point-color); color: white; border: none; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:9999; }
        .modal-content { background:white; padding:30px; border-radius:20px; width:85%; max-width:400px; text-align:center; }
    </style>
</head>
<body>

    <div style="height:100vh; position:relative;">
        <img id="mainSliderImg" src="./assets/main1.png" style="width:100%; height:100%; object-fit:cover;">
    </div>

    <section class="section">
        <h3>우리 결혼식까지</h3>
        <div id="d-day-timer" style="font-size:2rem; color:var(--point-color);"></div>
    </section>

    <section class="section">
        <h3>오시는 길</h3>
        <div id="map" style="width:100%; height:250px; border-radius:15px; margin-bottom:15px;"></div>
        <button class="btn-ui" onclick="window.open('https://map.naver.com/')">네이버 지도</button>
        <button class="btn-ui" onclick="window.open('https://kakaonavi.kakao.com/')">카카오 내비</button>
    </section>

    <section class="section">
        <button class="btn-ui btn-point" onclick="document.getElementById('accModal').style.display='flex'">마음 전하실 곳</button>
    </section>

    <div id="accModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>마음 전하실 곳</h3>
            <div style="text-align:left; font-size:1.1rem;">
                <p><b>[신랑측]</b><br>류승건: 우리 1002-841-241285<br>아버지: OO은행 123-456<br>어머니: OO은행 789-012</p>
                <p><b>[신부측]</b><br>이지연: OO은행 111-222<br>아버지: OO은행 333-444<br>어머니: OO은행 555-666</p>
                <p><a href="https://qr.kakaopay.com/...">카카오페이 송금하기</a></p>
            </div>
            <button class="btn-ui" onclick="document.getElementById('accModal').style.display='none'">닫기</button>
        </div>
    </div>

    <script>
        // 디데이 카운트다운
        function updateTimer() {
            const target = new Date('2026-08-15T12:00:00');
            const now = new Date();
            const diff = target - now;
            
            const d = Math.floor(diff / (1000*60*60*24));
            const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            const m = Math.floor((diff % (1000*60*60)) / (1000*60));
            
            document.getElementById('d-day-timer').innerText = `${d}일 ${h}시간 ${m}분 남았습니다.`;
        }
        setInterval(updateTimer, 60000);
        updateTimer();

        // 지도 초기화
        window.onload = () => {
            new naver.maps.Map('map', { center: new naver.maps.LatLng(37.265747, 126.999818), zoom: 16 });
        };
    </script>
</body>
</html>
