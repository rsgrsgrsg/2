<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>류승건 & 이지연 결혼식 초대장</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <script src="https://kit.fontawesome.com/your-fontawesome-key.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/add-to-calendar-button@2" async defer></script>
    
    <style>
        :root { --main-gold: #c2a379; --bg-gray: #f8f8f8; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; color: #333; background: #fff; line-height: 1.6; }
        .section { padding: 80px 20px; text-align: center; overflow: hidden; }
        .hero { height: 100vh; background: url('https://your-image-url.com/main.jpg') center/cover no-repeat; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 50px; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .btn-gold { background: var(--main-gold); color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; margin: 10px; }
        .kakao-pay { background: #fee500; color: #3c1e1e; font-weight: bold; border-radius: 8px; padding: 15px; display: inline-flex; align-items: center; text-decoration: none; }
        #guestbook { background: var(--bg-gray); border-radius: 15px; padding: 20px; margin-top: 30px; }
    </style>
</head>
<body>

    <section class="hero">
        <div data-aos="fade-up">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">류승건 & 이지연</h1>
            <p style="font-size: 1.2rem; letter-spacing: 3px;">2026. 08. 15. SAT. 12:00 PM</p>
        </div>
    </section>

    <section class="section" data-aos="fade-up">
        <h2 style="color: var(--main-gold);">Invitation</h2>
        <p>저희 결혼합니다.<br>서로에 대한 믿음과 사랑으로<br>하나가 되는 약속의 자리를 마련했습니다.</p>
        <p>함께 걸어온 길보다<br>함께 걸어갈 길이 더 설레는<br>저희의 시작을 축복해 주세요.</p>
    </section>

    <section class="section" style="background: var(--bg-gray);">
        <div data-aos="fade-right">
            <h3>Date & Venue</h3>
            <p>2026년 8월 15일 토요일 오후 12시</p>
            <p>수원 메리빌리아 가든홀</p>
            
            <add-to-calendar-button
                name="류승건 & 이지연 결혼식"
                startDate="2026-08-15"
                startTime="12:00"
                endTime="14:00"
                timeZone="Asia/Seoul"
                location="수원 메리빌리아 가든홀"
                options="'Apple','Google','Samsung','Outlook.com'"
                label="캘린더에 일정 추가"
                lightMode="bodyScheme"
            ></add-to-calendar-button>
        </div>
    </section>

    <section class="section" data-aos="fade-up">
        <h3>마음 전하실 곳</h3>
        <p>참석이 어려우신 분들을 위해<br>송금 페이지를 마련했습니다.</p>
        
        <a href="kakaotalk://kakaopay/money/to/qr?qr_code=여기에_본인_QR링크_입력" class="kakao-pay">
            카카오페이로 축의금 보내기
        </a>
    </section>

    <section class="section" style="background: var(--bg-gray);">
        <h3>Guestbook</h3>
        <div id="guestbook-container">
            <input type="text" id="name" placeholder="이름" style="width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ddd;">
            <textarea id="message" placeholder="축하 메시지를 남겨주세요." style="width: 80%; height: 80px; padding: 10px; border-radius: 5px; border: 1px solid #ddd;"></textarea>
            <br>
            <button onclick="saveMessage()" class="btn-gold">메시지 등록</button>
        </div>
        <div id="guestbook-list" style="margin-top: 20px; text-align: left; padding: 0 10%;"></div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script>
        // [승건님 설정 구역] 파이어베이스 콘솔에서 발급받은 키를 아래에 넣으세요
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function saveMessage() {
            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            if(name && message) {
                database.ref('guestbook').push({ name, message, timestamp: Date.now() });
                document.getElementById('name').value = '';
                document.getElementById('message').value = '';
            }
        }

        database.ref('guestbook').on('value', (snapshot) => {
            const list = document.getElementById('guestbook-list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `<div style="background:white; padding:15px; border-radius:10px; margin-bottom:10px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
                    <strong>${data.name}</strong><br>${data.message}</div>`;
            });
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>AOS.init();</script>
</body>
</html>
