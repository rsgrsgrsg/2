<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="류승건 ♥ 이지연 결혼합니다.">
    <meta property="og:description" content="2026년 08월 15일 토요일 오후 12시">
    <meta property="og:image" content="https://sg-jy.space/assets/main3.png">
    <meta property="og:url" content="https://sg-jy.space/">

    <title>류승건 & 이지연 결혼식 초대장</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400;700&family=Montserrat:wght@100;300;400&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js" integrity="sha384-lLeS4GCqY8u6YXSAbpU3pPZ2Yf+LOnT5E569u0jA2aM0o8b/7uYpY+6Z1W7I1pU7" crossorigin="anonymous"></script>

    <style>
        :root { --point-black: #000000; --point-color: #D1A7A7; --deep-gray: #333333; --bg-white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        input, textarea, [id*="acc-"], [id*="addr-"] { -webkit-user-select: text; user-select: text; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; color: var(--point-black); background: var(--bg-white); line-height: 1.8; word-break: keep-all; }
        [data-aos] { opacity: 1 !important; transform: translate(0) scale(1) !important; transition: none !important; }
        html.aos-init [data-aos] { opacity: 0; }
        html.aos-init .aos-animate { opacity: 1 !important; }
        .section { padding: 80px 30px; text-align: center; }
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--point-black); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; display: block; }
        .h-divider { width: 100%; height: 1px; background-color: var(--point-black); margin: 0; }
        .bgm-btn { position: fixed; top: 15px; right: 15px; z-index: 9990; width: 42px; height: 42px; background: rgba(255, 255, 255, 0.85); border: 1px solid #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--point-color); font-size: 1.1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); outline: none; }
        .bgm-btn.playing i.fa-music { animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hero-slider { height: 100vh; width: 100%; overflow: hidden; position: relative; background: #fff; }
        .hero-container { display: flex; height: 100%; width: 100%; will-change: transform; }
        .hero-item { min-width: 100%; height: 100%; position: relative; }
        .hero-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.15); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 1.2rem; }
        .prev-btn { left: 10px; } .next-btn { right: 10px; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 60px; color: white; text-align: center; pointer-events: none; z-index: 5; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .hero-names { font-size: 2.2rem; font-weight: 400; letter-spacing: 8px; margin-bottom: 10px; }
        .hero-date { font-size: 1.1rem; letter-spacing: 2px; opacity: 0.9; font-weight: 400; }
        .countdown-wrap { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
        .count-num { font-family: 'Montserrat', sans-serif; font-size: 1.8rem; font-weight: 300; }
        .count-label { font-size: 0.65rem; color: #999; letter-spacing: 2px; }
        .address-box { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .btn-copy-sm { border: 1px solid #000; background: none; padding: 2px 8px; font-size: 0.7rem; cursor: pointer; font-family: inherit; }
        .map-link-area { width: 100%; display: block; margin: 20px auto; border: 1px solid #eee; background-color: #f4f4f4; background-size: cover; background-position: center; }
        .gallery-wrap { position: relative; overflow: hidden; max-height: 5000px; transition: max-height 0.8s ease-in-out; }
        .gallery-wrap.limited { max-height: 330px; }
        .gallery-wrap.limited::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: linear-gradient(to bottom, transparent, var(--bg-white)); pointer-events: none; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 10px; }
        .gallery-item { aspect-ratio: 1 / 1; overflow: hidden; cursor: pointer; background: #f0f0f0; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .btn-more { margin: 20px auto; padding: 12px 30px; border: 1px solid #000; background: #fff; cursor: pointer; font-family: inherit; font-size: 0.85rem; display: block; }
        #galleryViewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10001; align-items: center; justify-content: center; }
        .viewer-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        .viewer-img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
        .viewer-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2.5rem; cursor: pointer; z-index: 10002; }
        .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 2.5rem; background: none; border: none; cursor: pointer; padding: 20px; z-index: 10002; opacity: 0.7; }
        .v-prev { left: 10px; } .v-next { right: 10px; }
        .viewer-count { position: absolute; bottom: 40px; color: #fff; font-size: 0.85rem; letter-spacing: 2px; }
        .btn-point { background: var(--point-color); color: white; border: none; padding: 18px; width: 100%; cursor: pointer; letter-spacing: 2px; font-weight: 700; font-family: inherit; font-size: 0.9rem; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 40px 25px; width: 90%; max-width: 400px; text-align: center; position: relative; }
        .close-modal { position: absolute; right: 15px; top: 15px; font-size: 1.5rem; cursor: pointer; color: #999; }
        .btn-kakaopay { display: flex; align-items: center; justify-content: center; gap: 8px; background: #FEE500; color: #191919; text-align: center; padding: 12px; font-size: 0.85rem; font-weight: 700; text-decoration: none; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

    <audio id="bgm" src="./assets/bgm.mp3" loop></audio>
    <button id="bgmBtn" class="bgm-btn" onclick="toggleBgm()">
        <i class="fas fa-music"></i>
    </button>

    <div class="hero-slider">
        <div class="hero-container" id="heroSlider">
            <div class="hero-item"><img src="./assets/main3.png"></div>
            <div class="hero-item"><img src="./assets/main1.png"></div>
            <div class="hero-item"><img src="./assets/main2.png"></div>
            <div class="hero-item"><img src="./assets/main3.png"></div>
            <div class="hero-item"><img src="./assets/main1.png"></div>
        </div>
        <button class="nav-btn prev-btn" onclick="moveSlider(-1)">&#10094;</button>
        <button class="nav-btn next-btn" onclick="moveSlider(1)">&#10095;</button>
        <div class="hero-overlay">
            <div data-aos="fade-up" data-aos-duration="2000">
                <h1 class="hero-names">류승건 & 이지연</h1>
                <p class="hero-date">2026. 08. 15. 토요일 오후 12시</p>
            </div>
        </div>
    </div>

    <div class="h-divider"></div>

    <section class="section" data-aos="fade-up" id="gallerySection">
        <span class="section-title">Gallery</span>
        <div class="gallery-wrap limited" id="galleryWrap">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
        <button id="moreBtn" class="btn-more" onclick="toggleGallery()">더보기 ▽</button>
    </section>

    <div id="galleryViewer">
        <span class="viewer-close" onclick="closeViewer()">×</span>
        <div class="viewer-content" id="viewerContent">
            <button class="viewer-nav v-prev" onclick="changeViewImg(-1)">&#10094;</button>
            <img src="" class="viewer-img" id="currentViewerImg">
            <button class="viewer-nav v-next" onclick="changeViewImg(1)">&#10095;</button>
            <div class="viewer-count" id="viewerCount">1 / 1</div>
        </div>
    </div>

    <div style="padding: 60px 20px; text-align: center; background-color: #f9f9f9; border-top: 1px solid #eee;">
        <button onclick="shareKakao()" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 auto; background-color: #FEE500; color: #191919; border: none; padding: 15px 30px; border-radius: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer; font-family: 'Noto Serif KR', serif;">
            <i class="fa-solid fa-comment"></i> 카카오톡으로 청첩장 보내기
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        // AOS 초기화
        window.onload = function() { AOS.init({ duration: 1200, once: true }); };

        // [복구] 메인 슬라이더 로직
        let heroIdx = 1;
        const heroContainer = document.getElementById('heroSlider');
        if(heroContainer) heroContainer.style.transform = `translateX(-100%)`;
        function moveSlider(dir) {
            heroIdx += dir;
            heroContainer.style.transition = 'transform 0.4s ease-out';
            heroContainer.style.transform = `translateX(-${heroIdx * 100}%)`;
        }
        if(heroContainer) {
            heroContainer.addEventListener('transitionend', () => {
                if (heroIdx === 0) { heroContainer.style.transition = 'none'; heroIdx = 3; heroContainer.style.transform = `translateX(-300%)`; }
                else if (heroIdx === 4) { heroContainer.style.transition = 'none'; heroIdx = 1; heroContainer.style.transform = `translateX(-100%)`; }
            });
        }

        // [복구] 갤러리 로직
        const galleryFiles = ['p01', 'p02', 'p03', 'p04', 'p05', 'p06', 'p11', 'p12', 'p13', 'p14', 'p15', 'p16', 'p17', 'p18', 'p19', 'p20', 'p21', 'p31', 'p32', 'p33', 'p34', 'p35', 'p36', 'p37', 'p39', 'p40', 'p61', 'p62', 'p63', 'p64', 'p65'];
        const grid = document.getElementById('galleryGrid');
        galleryFiles.forEach((name, idx) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.setAttribute('onclick', `openViewer(${idx})`);
            item.innerHTML = `<img src="./assets/p00/${name}.png" loading="lazy">`;
            grid.appendChild(item);
        });
        function toggleGallery() {
            const wrap = document.getElementById('galleryWrap');
            wrap.classList.toggle('limited');
            document.getElementById('moreBtn').innerText = wrap.classList.contains('limited') ? '더보기 ▽' : '접기 △';
        }
        let gViewIdx = 0;
        function openViewer(idx) { gViewIdx = idx; updateViewer(); document.getElementById('galleryViewer').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
        function closeViewer() { document.getElementById('galleryViewer').style.display = 'none'; document.body.style.overflow = 'auto'; }
        function changeViewImg(dir) { gViewIdx = (gViewIdx + dir + galleryFiles.length) % galleryFiles.length; updateViewer(); }
        function updateViewer() {
            document.getElementById('currentViewerImg').src = `./assets/p00/${galleryFiles[gViewIdx]}.png`;
            document.getElementById('viewerCount').innerText = `${gViewIdx + 1} / ${galleryFiles.length}`;
        }

        // [카카오톡 공유 최종]
        // 앱 ID(1460840)의 JavaScript 키를 여기에 넣으세요 (스크린샷 9.40.16.png의 키를 유지했습니다)
        Kakao.init('d5e6a819a47355199ed57682989b9ef8'); 
        function shareKakao() {
            Kakao.Share.sendCustom({
                templateId: 133283 // 새로운 템플릿 ID 적용!
            });
        }
    </script>
</body>
</html>
