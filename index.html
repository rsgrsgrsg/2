<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>류승건 &amp; 이지연 결혼식 초대장</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400;700&family=Montserrat:wght@100;300;400&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    
    <style>
        :root {
            --point-black: #000000;
            --deep-gray: #333333;
            --border-color: #000000;
            --bg-white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; color: var(--point-black); background: var(--bg-white); line-height: 1.8; word-break: keep-all; }

        /* 1. Hero Slider */
        .hero-slider {
            height: 100vh; width: 100%; overflow: hidden; position: relative; background: #000;
        }
        .hero-container {
            display: flex; height: 100%; width: 100%; overflow-x: auto; 
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
        }
        .hero-container::-webkit-scrollbar { display: none; }
        .hero-item { min-width: 100%; height: 100%; scroll-snap-align: start; position: relative; }
        .hero-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) brightness(0.6); }
        
        /* Slider Buttons (Web Only) */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.2); border: none; color: white;
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: none; align-items: center; justify-content: center; z-index: 10;
        }
        @media (min-width: 768px) { .nav-btn { display: flex; } }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; pointer-events: none; z-index: 5;
        }
        .hero-names { font-size: 2.2rem; font-weight: 200; letter-spacing: 8px; margin-bottom: 20px; }
        .hero-date { font-family: 'Montserrat', sans-serif; font-size: 0.9rem; letter-spacing: 5px; opacity: 0.8; }

        /* 가로 구분선 */
        .h-divider { width: 100%; height: 1px; background-color: var(--point-black); margin: 0; opacity: 1; }

        /* Section Layout */
        .section { padding: 80px 30px; text-align: center; }
        .section.compact { padding: 40px 30px; } 
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--point-black); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; display: block; }

        /* Countdown */
        .countdown-wrap { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
        .count-num { font-family: 'Montserrat', sans-serif; font-size: 1.8rem; font-weight: 300; }
        .count-label { font-size: 0.65rem; color: #999; letter-spacing: 2px; }

        /* Address Box */
        .address-box { display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .btn-copy-sm { 
            border: 1px solid #000; background: none; padding: 2px 8px; font-size: 0.7rem; 
            cursor: pointer; font-family: inherit; transition: 0.3s;
        }

        /* Guestbook & Modal */
        .gb-card { background: white; padding: 30px 20px; border: 1px solid #eee; max-width: 450px; margin: 0 auto; }
        input, textarea { width: 100%; padding: 15px; border: 1px solid #eee; margin-bottom: 10px; font-family: inherit; font-size: 0.9rem; }
        .btn-black { background: var(--point-black); color: white; border: none; padding: 18px; width: 100%; cursor: pointer; letter-spacing: 2px; }
        
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 40px 25px; width: 90%; max-width: 400px; text-align: center; position: relative; }
        .close-modal { position: absolute; right: 15px; top: 15px; font-size: 1.5rem; cursor: pointer; color: #999; }
    </style>
</head>
<body>

    <div class="hero-slider">
        <div class="hero-container" id="heroSlider">
            <div class="hero-item"><img src="./assets/images/main1.png" alt="메인사진1"></div>
            <div class="hero-item"><img src="./assets/images/main2.png" alt="메인사진2"></div>
            <div class="hero-item"><img src="./assets/images/main3.png" alt="메인사진3"></div>
        </div>
        
        <button class="nav-btn prev-btn" onclick="moveSlider(-1)">&#10094;</button>
        <button class="nav-btn next-btn" onclick="moveSlider(1)">&#10095;</button>

        <div class="hero-overlay">
            <div data-aos="fade-up" data-aos-duration="2000">
                <h1 class="hero-names">류승건 &amp; 이지연</h1>
                <p class="hero-date">2026년 8월 15일 토요일 오후 12:00 </p>
            </div>
        </div>
    </div>

    <div class="h-divider"></div>

    <section class="section" data-aos="fade-up">
        <span class="section-title">Invitation</span>
        <p style="font-size: 1rem; line-height: 2.4;">
            곁에 있을 때 가장 나다워지는 사람을 만났습니다.<br>
            서로의 결을 닮아가는 사랑으로<br>
            함께 걸어갈 새날의 시작을 약속합니다.
        </p>
    </section>

    <div class="h-divider"></div>

    <section class="section compact" data-aos="fade-up">
        <span class="section-title">D-Day</span>
        <div class="countdown-wrap">
            <div class="count-item"><span class="count-num" id="days">00</span><br><span class="count-label">DAYS</span></div>
            <div class="count-item"><span class="count-num" id="hours">00</span><br><span class="count-label">HOURS</span></div>
            <div class="count-item"><span class="count-num" id="mins">00</span><br><span class="count-label">MINS</span></div>
        </div>
    </section>

    <div class="h-divider"></div>

    <section class="section compact" data-aos="fade-up">
        <span class="section-title">Location</span>
        <h3 style="font-weight: 700; font-size: 1.2rem; margin-bottom: 5px;">수원 메리빌리아 가든홀</h3>
        
        <div class="address-box">
            <span id="addr-text" style="color: #888; font-size: 0.85rem;">수원시 권선구 서둔동 389</span>
            <button class="btn-copy-sm" onclick="copyToClipboard('addr-text')">복사</button>
        </div>

        <div style="width: 100%; height: 250px; background: #f9f9f9; border: 1px solid #eee; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 0.8rem; margin-bottom: 20px;">
            네이버 지도 영역
        </div>

        <a href="https://map.naver.com/" target="_blank" style="text-decoration: none; color: #000; font-size: 0.8rem; border-bottom: 1px solid #000; padding-bottom: 2px;">네이버 지도로 길 찾기</a>
    </section>

    <div class="h-divider"></div>

    <section class="section compact" data-aos="fade-up">
        <span class="section-title">Guestbook</span>
        <div class="gb-card">
            <input type="text" id="gb_name" placeholder="NAME">
            <textarea id="gb_msg" rows="3" placeholder="MESSAGE"></textarea>
            <button onclick="saveMessage()" class="btn-black">SUBMIT</button>
            <div id="guestbook-list" style="margin-top: 20px;"></div>
        </div>
        <button onclick="openModal()" class="btn-black" style="max-width: 300px; background: none; color: #000; border: 1px solid #000; margin-top: 40px;">마음 전하실 곳</button>
    </section>

    <div id="accountModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 style="font-weight: 400; margin-bottom: 30px; letter-spacing: 2px;">ACCOUNT</h3>
            <div style="text-align: left; padding: 10px 0; border-bottom: 1px solid #eee;">
                <p style="font-size: 0.8rem; color: #888; margin: 0;">신랑 류승건</p>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="acc-groom">우리 1002-841-241285</span>
                    <button class="btn-copy-sm" onclick="copyToClipboard('acc-groom')">복사</button>
                </div>
            </div>
            <div style="text-align: left; padding: 10px 0;">
                <p style="font-size: 0.8rem; color: #888; margin: 0;">신부 이지연</p>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="acc-bride">카뱅 3333-xx-xxxxxxx</span>
                    <button class="btn-copy-sm" onclick="copyToClipboard('acc-bride')">복사</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script>
        // 1. Slider Logic
        function moveSlider(dir) {
            const container = document.getElementById('heroSlider');
            const width = container.offsetWidth;
            container.scrollBy({ left: dir * width, behavior: 'smooth' });
        }

        // 2. Copy Function
        function copyToClipboard(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => alert("복사되었습니다."));
        }

        // 3. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD1LmVHTLYnecokZV67_hCDcM289fl3oiw",
            authDomain: "sg-jy-233e2.firebaseapp.com",
            databaseURL: "https://sg-jy-233e2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sg-jy-233e2",
            storageBucket: "sg-jy-233e2.firebasestorage.app",
            messagingSenderId: "217599075354",
            appId: "1:217599075354:web:c227474b5efc4fd280dda3"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 4. Modal
        function openModal() { document.getElementById('accountModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('accountModal').style.display = 'none'; }

        // 5. Countdown
        function updateCountdown() {
            const target = new Date('2026-08-15T12:00:00').getTime();
            const now = new Date().getTime();
            const diff = target - now;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('days').innerText = d < 10 ? '0'+d : d;
            document.getElementById('hours').innerText = h < 10 ? '0'+h : h;
            document.getElementById('mins').innerText = m < 10 ? '0'+m : m;
        }
        setInterval(updateCountdown, 1000); updateCountdown();

        // 6. Guestbook
        function saveMessage() {
            const name = document.getElementById('gb_name').value;
            const msg = document.getElementById('gb_msg').value;
            if (name.trim() && msg.trim()) {
                database.ref('guestbook').push({ name, message: msg, timestamp: Date.now() })
                .then(() => { document.getElementById('gb_name').value = ''; document.getElementById('gb_msg').value = ''; });
            }
        }
        database.ref('guestbook').on('value', (snapshot) => {
            const list = document.getElementById('guestbook-list'); list.innerHTML = '';
            const items = []; snapshot.forEach(child => items.push(child.val()));
            items.reverse().forEach(data => {
                const div = document.createElement('div'); div.style.textAlign='left'; div.style.borderBottom='1px solid #f2f2f2'; div.style.padding='15px 0';
                div.innerHTML = `<strong>${data.name}</strong><br><span style="font-size:0.9rem; color:#444;">${data.message}</span>`;
                list.appendChild(div);
            });
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>AOS.init({ duration: 1000, once: true });</script>
</body>
</html>
