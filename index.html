<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>류승건 & 이지연 결혼식</title>
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=vox8crpza6"></script>
    <style>
        :root { --point-color: #D1A7A7; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; color: #333; }
        .section { padding: 60px 30px; text-align: center; }
        .btn-ui { padding: 16px 30px; border-radius: 50px; border: 1px solid #ddd; background: #fff; cursor: pointer; transition: 0.3s; margin: 5px; font-weight: 600; font-family: inherit; }
        .btn-point { background: var(--point-color); color: white; border: none; box-shadow: 0 4px 10px rgba(209, 167, 167, 0.3); }
        .gallery-wrap { max-height: 400px; overflow: hidden; transition: 0.5s; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .gallery-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 15px; cursor: pointer; }
        #gb-list { height: 250px; overflow-y: auto; text-align: left; padding: 15px; border: 1px solid #eee; border-radius: 20px; margin-top: 15px; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999; }
        .modal-content { background:white; padding:40px; border-radius:30px; width:80%; max-width:400px; text-align:left; }
    </style>
</head>
<body>

    <div style="height:100vh; position:relative;">
        <img id="mainSliderImg" src="./assets/main1.png" style="width:100%; height:100%; object-fit:cover;">
        <div style="position:absolute; bottom:15%; width:100%; color:white; text-align:center; text-shadow:0 2px 10px rgba(0,0,0,0.8);">
            <h1 style="font-size:2.5rem; margin:0;">류승건 & 이지연</h1>
            <p style="font-size:1.2rem; font-weight:bold;">2026년 8월 15일 토요일 오후 12시</p>
        </div>
    </div>

    <section class="section">
        <h3>D-Day</h3>
        <div id="d-day-result" style="font-size:1.5rem; color:var(--point-color); font-weight:bold;"></div>
    </section>

    <section class="section">
        <h3>Location</h3>
        <div id="map" style="width:100%; height:300px; border-radius:20px;"></div>
    </section>

    <section class="section">
        <h3>Gallery</h3>
        <div id="galleryWrap" class="gallery-wrap">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
        <button class="btn-ui" id="moreBtn" onclick="toggleGallery()">더보기</button>
    </section>

    <section class="section">
        <button class="btn-ui btn-point" onclick="document.getElementById('accModal').style.display='flex'">마음 전하실 곳</button>
        <div style="margin-top:40px;">
            <input type="text" id="gb_name" class="btn-ui" placeholder="성함" style="width:90%;">
            <textarea id="gb_msg" class="btn-ui" placeholder="축하 메시지" style="width:90%; height:80px;"></textarea>
            <button class="btn-ui btn-point" onclick="saveGuestMessage()" style="width:90%;">메시지 남기기</button>
            <div id="gb-list"></div>
        </div>
    </section>

    <div id="accModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>마음 전하실 곳</h3>
            <p><b>[신랑]</b> 류승건: 우리 1002-841-241285</p>
            <p><b>[신부]</b> 이지연: 새마을 9003-1978-4884-1</p>
            <button class="btn-ui" onclick="document.getElementById('accModal').style.display='none'">닫기</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script>
        window.onload = () => {
            new naver.maps.Map('map', { center: new naver.maps.LatLng(37.265747, 126.999818), zoom: 16 });
            
            let idx = 1;
            setInterval(() => {
                idx = idx >= 3 ? 1 : idx + 1;
                document.getElementById('mainSliderImg').src = `./assets/main${idx}.png`;
            }, 3000);

            const files = ['p01.png','p02.png','p03.png','p04.png','p05.png','p06.png','p11.png','p12.png','p13.png','p14.png','p15.png','p16.png','p17.png','p18.png','p19.png','p20.png','p21.png','p31.png','p32.png','p33.png','p34.png','p35.png','p36.png','p37.png','p39.png','p40.png','p51.png','p52.png','p53.png','p54.png','p56.png','p57.png','p58.jpg','p61.png','p62.png','p63.png','p64.png','p65.png'];
            const grid = document.getElementById('galleryGrid');
            files.forEach(f => grid.innerHTML += `<div class="gallery-item"><img src="./assets/p00/${f}"></div>`);

            setInterval(() => {
                const diff = new Date('2026-08-15T12:00:00') - new Date();
                const d = Math.floor(diff / (1000*60*60*24));
                const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
                const m = Math.floor((diff % (1000*60*60)) / (1000*60));
                document.getElementById('d-day-result').innerText = `결혼식까지 ${d}일 ${h}시간 ${m}분 남았습니다.`;
            }, 1000);
        };

        const db = firebase.initializeApp({apiKey: "AIzaSyD1LmVHTLYnecokZV67_hCDcM289fl3oiw", databaseURL: "https://sg-jy-233e2-default-rtdb.asia-southeast1.firebasedatabase.app"}).database();
        function saveGuestMessage() {
            const n = document.getElementById('gb_name').value.trim();
            const m = document.getElementById('gb_msg').value.trim();
            if (!n && !m) return alert('성함과 축하 메시지를 입력해주세요.');
            if (!n) return alert('성함을 입력해주세요.');
            if (!m) return alert('축하 메시지를 입력해주세요.');
            db.ref('guestbook').push({name: n, msg: m});
            alert('등록 완료!');
        }

        function toggleGallery() {
            const w = document.getElementById('galleryWrap');
            const b = document.getElementById('moreBtn');
            const isOpen = w.style.maxHeight !== '400px';
            w.style.maxHeight = isOpen ? '400px' : '2000px';
            b.innerText = isOpen ? '더보기' : '접기';
        }
    </script>
</body>
</html>
