<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>류승건 & 이지연 청첩장</title>
    
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #fff; }
        .btn-kakao { 
            background-color: #FEE500; color: #191919; border: none; 
            padding: 20px 40px; border-radius: 12px; font-weight: bold; 
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .info { margin-top: 20px; color: #666; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>

    <h2>카카오톡 공유 테스트</h2>
    
    <button type="button" class="btn-kakao" onclick="shareKakao()">
        카카오톡으로 청첩장 보내기
    </button>

    <div class="info">
        버튼을 눌렀을 때 아무 반응이 없다면<br>
        파일이 제대로 저장/업로드 되었는지 확인해주세요.
    </div>

    <script>
        // 1. 초기화 시도 및 에러 체크
        try {
            if (!Kakao.isInitialized()) {
                // 사용자님의 JavaScript 키 적용
                Kakao.init('a5ea5495dd09ddffc0e6d746f448858b');
                console.log('카카오 초기화 성공 여부:', Kakao.isInitialized());
            }
        } catch (e) {
            alert('초기화 단계 에러: ' + e.message);
        }

        // 2. 공유 함수
        function shareKakao() {
            // 버튼이 눌렸는지 확인하기 위한 첫 번째 알림
            alert('1단계: 버튼 클릭됨');

            try {
                Kakao.Share.sendCustom({
                    templateId: 133283, // 알려주신 템플릿 ID
                    installTalk: true,
                    fail: function(err) {
                        // 전송 실패 시 이유를 팝업으로 띄움
                        alert('전송 실패 에러:\n' + JSON.stringify(err));
                    },
                    success: function() {
                        alert('공유 성공!');
                    }
                });
            } catch (e) {
                alert('함수 실행 중 에러: ' + e.message);
            }
        }
    </script>

</body>
</html>
