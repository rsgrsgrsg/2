<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>류승건 & 이지연 결혼식 초대장</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400;700&family=Montserrat:wght@100;300;400&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --point-black: #000000; 
            --point-color: #D1A7A7;
            --deep-gray: #333333; 
            --bg-white: #ffffff; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        input, textarea, [id*="acc-"], [id*="addr-"] { -webkit-user-select: text; user-select: text; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; color: var(--point-black); background: var(--bg-white); line-height: 1.8; word-break: keep-all; }

        .section { padding: 80px 30px; text-align: center; }
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--point-black); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; display: block; }
        .h-divider { width: 100%; height: 1px; background-color: var(--point-black); margin: 0; }
        
        /* 버튼 공통 스타일 */
        .btn-default { display: block; width: 100%; padding: 12px; border: 1px solid #ddd; font-size: 0.85rem; text-decoration: none; color: #333; background: #fff; text-align: center; cursor: pointer; font-family: inherit; }
        
        /* BGM 및 기타 기존 스타일 유지 */
        .bgm-btn { position: fixed; top: 15px; right: 15px; z-index: 9990; width: 42px; height: 42px; background: rgba(255, 255, 255, 0.85); border: 1px solid #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--point-color); font-size: 1.1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .hero-slider { height: 100vh; width: 100%; overflow: hidden; position: relative; }
        .gallery-wrap { position: relative; overflow: hidden; max-height: 5000px; transition: max-height 0.8s ease-in-out; }
        .gallery-wrap.limited { max-height: 330px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 10px; }
        .gallery-item { aspect-ratio: 1 / 1; overflow: hidden; cursor: pointer; background: #f0f0f0; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 방명록 스크롤 */
        #gb-list { margin-top: 20px; max-height: 250px; overflow-y: auto; border-top: 1px solid #f2f2f2; }
        
        .btn-point { background: var(--point-color); color: white; border: none; padding: 18px; width: 100%; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 0.9rem; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 40px 25px; width: 90%; max-width: 400px; text-align: center; overflow-y: auto; max-height: 80vh; }
        .btn-kakaopay { display: flex; align-items: center; justify-content: center; gap: 8px; background: #FEE500; color: #191919; padding: 10px; font-size: 0.85rem; font-weight: 700; text-decoration: none; border-radius: 6px; margin: 5px 0 15px; }
    </style>
</head>
<body>

    <section class="section" id="gallerySection">
        <span class="section-title">Gallery</span>
        <div class="gallery-wrap limited" id="galleryWrap">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
        <button id="moreBtn" class="btn-default" style="margin-top:20px;" onclick="toggleGallery()">더보기 ▽</button>
    </section>

    <script>
        // 2, 3번: 갤러리 이미지 리스트 (jpg 포함)
        const galleryFiles = [
            'p01.png', 'p02.png', 'p03.png', 'p04.png', 'p05.png', 'p06.png', 
            'p11.png', 'p12.png', 'p13.png', 'p14.png', 'p15.png', 'p16.png', 'p17.png', 'p18.png', 'p19.png', 'p20.png', 'p21.png',
            'p31.png', 'p32.png', 'p33.png', 'p34.png', 'p35.png', 'p36.png', 'p37.png', 'p39.png', 'p40.png',
            'p51.png', 'p52.png', 'p53.png', 'p54.png', 'p56.png', 'p57.png', 'p58.jpg',
            'p61.png', 'p62.png', 'p63.png', 'p64.png', 'p65.png'
        ];

        function initGallery() {
            const grid = document.getElementById('galleryGrid');
            galleryFiles.forEach((filename, idx) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openViewer(idx);
                item.innerHTML = `<img src="./assets/p00/${filename}" loading="lazy">`;
                grid.appendChild(item);
            });
        }
        initGallery();

        // 6번: 메시지 남기기 유효성 검사
        function saveGuestMessage() {
            let name = document.getElementById('gb_name').value.trim();
            let msg = document.getElementById('gb_msg').value.trim();
            
            if (!name && !msg) { alert("성함과 메시지를 기재해주세요."); return; }
            if (!name) { alert("성함을 기재해주세요."); return; }
            if (!msg) { alert("메시지를 기재해주세요."); return; }
            
            // 이후 파이어베이스 저장 로직...
        }

        function toggleGallery() {
            const wrap = document.getElementById('galleryWrap');
            const btn = document.getElementById('moreBtn');
            if (wrap.classList.contains('limited')) {
                wrap.classList.remove('limited');
                btn.innerText = '접기 △';
            } else {
                wrap.classList.add('limited');
                btn.innerText = '더보기 ▽';
                document.getElementById('gallerySection').scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
