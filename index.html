<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>류승건 & 이지연 결혼식</title>
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=vox8crpza6"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --main-color: #D1A7A7; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; color: #333; }
        .section { padding: 60px 20px; text-align: center; }
        
        /* 🎨 버튼 디자인 통일 (라운드 처리) */
        .btn { display: inline-block; padding: 14px 28px; border-radius: 30px; border: 1px solid #ddd; background: #fff; color: #555; text-decoration: none; font-size: 0.9rem; margin: 5px; transition: 0.3s; cursor: pointer; }
        .btn-point { background: var(--main-color); border: none; color: white; font-weight: bold; }
        
        /* 지도 & 방명록 */
        #map { width: 100%; height: 300px; border-radius: 20px; margin: 20px 0; }
        #gb-list { height: 250px; overflow-y: auto; text-align: left; padding: 15px; border: 1px solid #eee; border-radius: 15px; margin-top: 10px; background: #fdfdfd; }
    </style>
</head>
<body>

    <div style="height:100vh; position:relative; background:#000;">
        <div id="heroSlider" style="height:100%; background:#eee;"></div>
        <div style="position:absolute; bottom:15%; width:100%; color:white; text-align:center; text-shadow:0 2px 10px rgba(0,0,0,0.8);">
            <h1 style="font-size:2.5rem; margin:0;">류승건 & 이지연</h1>
            <p style="font-size:1.2rem; margin-top:10px;">2026년 8월 15일 토요일 오후 12시</p>
        </div>
    </div>

    <section class="section">
        <h3>D-Day</h3>
        <p>2026년 8월 15일</p>
        <div id="d-day" style="font-size:2rem; color:var(--main-color);">계산중...</div>
    </section>

    <section class="section">
        <h3>Location</h3>
        <div id="map"></div>
        <a href="https://naver.me/5apDP7nI" class="btn">네이버 지도</a>
        <a href="https://kko.to/EIt4OnhVm4" class="btn">카카오내비</a>
    </section>

    <section class="section">
        <h3>Gallery</h3>
        <div id="galleryGrid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:5px;"></div>
        <button class="btn" onclick="alert('더보기 기능')">사진 더보기</button>
    </section>

    <section class="section">
        <h3>Guestbook</h3>
        <input type="text" id="gb_name" placeholder="성함" class="btn" style="width:100%; border-radius:10px;">
        <textarea id="gb_msg" placeholder="축하 메시지" class="btn" style="width:100%; height:80px; border-radius:10px;"></textarea>
        <button class="btn btn-point" onclick="saveGuestMessage()">메시지 남기기</button>
        <div id="gb-list"></div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script>

    <script>
        // 지도 동적 생성
        window.onload = () => {
            new naver.maps.Map('map', { 
                center: new naver.maps.LatLng(37.265747, 126.999818), 
                zoom: 16 
            });
            new naver.maps.Marker({ 
                position: new naver.maps.LatLng(37.265747, 126.999818), 
                map: new naver.maps.Map('map', { center: new naver.maps.LatLng(37.265747, 126.999818), zoom: 16 }) 
            });
            updateDday();
        };

        // 방명록 리스트(스크롤 페이징)
        const db = firebase.initializeApp({apiKey: "AIzaSyD1LmVHTLYnecokZV67_hCDcM289fl3oiw", databaseURL: "https://sg-jy-233e2-default-rtdb.asia-southeast1.firebasedatabase.app"}).database();
        db.ref('guestbook').on('value', (snap) => {
            const list = document.getElementById('gb-list'); list.innerHTML = '';
            snap.forEach(c => list.innerHTML += `<div style="border-bottom:1px solid #eee; padding:10px;"><b>${c.val().name}</b><br>${c.val().msg}</div>`);
        });

        function saveGuestMessage() {
            const name = document.getElementById('gb_name').value;
            const msg = document.getElementById('gb_msg').value;
            if(!name || !msg) return alert('입력하세요!');
            db.ref('guestbook').push({name, msg});
        }
        
        function updateDday() {
            const d = Math.floor((new Date('2026-08-15') - new Date()) / (1000*60*60*24));
            document.getElementById('d-day').innerText = `${d}일 남았습니다.`;
        }
    </script>
</body>
</html>
