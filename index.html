<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>류승건 & 이지연 결혼식</title>
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=vox8crpza6"></script>
    <style>
        :root { --main-color: #D1A7A7; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; }
        .section { padding: 50px 20px; text-align: center; }
        .btn { padding: 12px 25px; border-radius: 25px; border: 1px solid #ddd; background: #fff; cursor: pointer; margin: 5px; }
        .btn-point { background: var(--main-color); color: white; border: none; }
        
        /* 갤러리 접기/펼치기 */
        .gallery-wrap { max-height: 400px; overflow: hidden; transition: 0.5s; }
        .gallery-wrap.open { max-height: 2000px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .gallery-item img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        
        /* 모달 디자인 */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
        .modal-content { background:white; padding:30px; border-radius:20px; width:80%; }
    </style>
</head>
<body>

    <div style="height:100vh; background:#eee;">
        <img id="mainImg" src="./assets/main1.png" style="width:100%; height:80%; object-fit:cover;">
        <h1>류승건 & 이지연</h1>
        <p>2026년 8월 15일 토요일 오후 12시</p>
    </div>

    <section class="section">
        <h3>Location</h3>
        <div id="map" style="width:100%; height:300px;"></div>
    </section>

    <section class="section">
        <h3>Gallery</h3>
        <div id="galleryWrap" class="gallery-wrap">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
        <button class="btn" id="moreBtn" onclick="toggleGallery()">사진 더보기</button>
    </section>

    <section class="section">
        <button class="btn btn-point" onclick="document.getElementById('accModal').style.display='flex'">마음 전하실 곳</button>
    </section>

    <div id="accModal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>마음 전하실 곳</h3>
            <p>신랑 류승건: 우리은행 123-456-789</p>
            <button class="btn" onclick="document.getElementById('accModal').style.display='none'">닫기</button>
        </div>
    </div>

    <script>
        // 지도 동적 로드
        window.onload = () => {
            new naver.maps.Map('map', { center: new naver.maps.LatLng(37.265747, 126.999818), zoom: 16 });
            
            // 메인 이미지 슬라이더 (3초 간격)
            let i = 1;
            setInterval(() => {
                i = i >= 3 ? 1 : i + 1;
                document.getElementById('mainImg').src = `./assets/main${i}.png`;
            }, 3000);
        };

        // 갤러리 더보기/접기
        function toggleGallery() {
            const wrap = document.getElementById('galleryWrap');
            const btn = document.getElementById('moreBtn');
            wrap.classList.toggle('open');
            btn.innerText = wrap.classList.contains('open') ? '접기' : '사진 더보기';
        }
    </script>
</body>
</html>
