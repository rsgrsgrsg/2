<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>류승건 & 이지연 결혼식</title>
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=vox8crpza6"></script>
    <style>
        :root { --main-color: #D1A7A7; --text-color: #333; }
        body { font-family: 'Noto Serif KR', serif; color: var(--text-color); margin: 0; }
        .section { padding: 60px 20px; text-align: center; }
        
        /* 🎨 버튼 디자인 통일: 모서리가 둥근 디자인 */
        .btn { display: inline-block; padding: 15px 30px; border-radius: 30px; border: 1px solid #ddd; background: #fff; color: #555; text-decoration: none; font-size: 0.9rem; transition: 0.3s; margin: 5px; cursor: pointer; }
        .btn-point { background: var(--main-color); color: #fff; border: none; width: 80%; }
        
        /* 지도 & 갤러리 */
        #map { width: 100%; height: 300px; border-radius: 20px; margin: 20px 0; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .gallery-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
        
        /* 방명록 페이징(5줄 제한) */
        #gb-list { height: 250px; overflow-y: auto; text-align: left; padding: 10px; border: 1px solid #eee; border-radius: 15px; }
    </style>
</head>
<body>
    <div style="height:100vh; position:relative; overflow:hidden;">
        <div id="heroSlider" style="height:100%; background:#eee;"></div>
        <div style="position:absolute; bottom:10%; width:100%; color:white; text-align:center; text-shadow:0 2px 10px rgba(0,0,0,0.8);">
            <h1 style="font-size:2.5rem; margin:0;">류승건 & 이지연</h1>
            <p style="font-size:1.2rem; font-weight:bold;">2026년 8월 15일 토요일 오후 12시</p>
        </div>
    </div>

    <section class="section">
        <h3>D-Day</h3>
        <p>2026년 8월 15일</p>
        <div id="d-day" style="font-size:2rem; color:var(--main-color);">계산중...</div>
    </section>

    <section class="section">
        <h3>Location</h3>
        <div id="map"></div>
        <a href="https://naver.me/5apDP7nI" class="btn">네이버 지도</a>
        <a href="https://kko.to/EIt4OnhVm4" class="btn">카카오내비</a>
    </section>

    <section class="section">
        <h3>Gallery</h3>
        <div class="gallery-grid" id="galleryGrid"></div>
        <button class="btn" onclick="toggleGallery()">사진 더보기</button>
    </section>

    <section class="section">
        <h3>Guestbook</h3>
        <input type="text" id="gb_name" placeholder="성함" class="btn" style="width:100%;">
        <textarea id="gb_msg" placeholder="축하 메시지" class="btn" style="width:100%; height:80px;"></textarea>
        <button class="btn btn-point" onclick="saveGuestMessage()">메시지 남기기</button>
        <div id="gb-list"></div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <script>
        // 지도 초기화
        window.onload = () => {
            new naver.maps.Map('map', { center: new naver.maps.LatLng(37.265747, 126.999818), zoom: 16 });
            updateDday();
        };

        // 갤러리 (JPG/PNG 확장자 자동 처리)
        const files = ['p01.png','p02.png','p03.png','p04.png','p05.png','p06.png','p11.png','p12.png','p13.png','p14.png','p15.png','p16.png','p17.png','p18.png','p19.png','p20.png','p21.png','p31.png','p32.png','p33.png','p34.png','p35.png','p36.png','p37.png','p39.png','p40.png','p51.png','p52.png','p53.png','p54.png','p56.png','p57.png','p58.jpg','p61.png','p62.png','p63.png','p64.png','p65.png'];
        const grid = document.getElementById('galleryGrid');
        files.forEach(f => grid.innerHTML += `<div class="gallery-item"><img src="./assets/p00/${f}"></div>`);

        // 디데이
        function updateDday() {
            const d = Math.floor((new Date('2026-08-15') - new Date()) / (1000*60*60*24));
            document.getElementById('d-day').innerText = `${d}일 남았습니다.`;
        }

        // 방명록 (Firebase)
        const db = firebase.initializeApp({apiKey: "AIzaSyD1LmVHTLYnecokZV67_hCDcM289fl3oiw", databaseURL: "https://sg-jy-233e2-default-rtdb.asia-southeast1.firebasedatabase.app"}).database();
        function saveGuestMessage() {
            const name = document.getElementById('gb_name').value;
            const msg = document.getElementById('gb_msg').value;
            db.ref('guestbook').push({name, msg});
            alert('등록 완료!');
        }
    </script>
</body>
</html>
