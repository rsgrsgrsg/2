<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>류승건 & 이지연 결혼식 초대장</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400;700&family=Montserrat:wght@100;300;400&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="./assets/app.png"> 
    
    <style>
        :root { --point-black: #000000; --point-color: #D1A7A7; --deep-gray: #333333; --bg-white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Serif KR', serif; margin: 0; color: var(--point-black); background: var(--bg-white); line-height: 1.8; word-break: keep-all; }
        [data-aos] { opacity: 1 !important; transform: translate(0) scale(1) !important; transition: none !important; }
        .section { padding: 80px 30px; text-align: center; }
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--point-black); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; display: block; }
        .h-divider { width: 100%; height: 1px; background-color: var(--point-black); margin: 0; }
        .btn-point { background: var(--point-color); color: white; border: none; padding: 15px; width: 100%; cursor: pointer; letter-spacing: 2px; font-weight: 700; font-size: 0.9rem; display: block; text-align: center; text-decoration: none; border-radius: 8px; }
        .btn-copy-sm { background: var(--point-color); color: white; border: none; padding: 6px 12px; font-size: 0.75rem; cursor: pointer; border-radius: 6px; }
        .bgm-btn { position: fixed; top: 15px; right: 15px; z-index: 9990; width: 42px; height: 42px; background: rgba(255, 255, 255, 0.85); border: 1px solid #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--point-color); font-size: 1.1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .hero-slider { height: 100vh; width: 100%; overflow: hidden; position: relative; }
        .hero-container { display: flex; height: 100%; width: 100%; transition: transform 0.4s ease-out; }
        .hero-item { min-width: 100%; height: 100%; position: relative; }
        .hero-item img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay { position: absolute; bottom: 60px; left: 0; width: 100%; color: white; text-align: center; z-index: 5; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .hero-date { font-size: 1.3rem; line-height: 1.6; color: #ffffff; }
        .gallery-wrap { position: relative; overflow: hidden; max-height: 5000px; transition: max-height 0.8s; }
        .gallery-wrap.limited { max-height: 330px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 10px; }
        .gallery-item { aspect-ratio: 1 / 1; overflow: hidden; cursor: pointer; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; width: 90%; max-width: 400px; border-radius: 12px; position: relative; }
        .btn-kakaopay { display: flex; align-items: center; justify-content: center; gap: 8px; background: #FEE500; color: #191919; padding: 12px; font-weight: 700; text-decoration: none; border-radius: 8px; margin-top: 10px; }
        .acc-group { text-align: left; padding: 15px 0; border-bottom: 1px solid #eee; }
        .acc-row { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body oncontextmenu="return false">

    <audio id="bgm" src="./assets/bgm.mp3" loop></audio>
    <button id="bgmBtn" class="bgm-btn" onclick="toggleBgm()"><i class="fas fa-music"></i></button>

    <div class="hero-slider">
        <div class="hero-container" id="heroSlider">
            <div class="hero-item"><img src="./assets/main3.png"></div>
            <div class="hero-item"><img src="./assets/main1.png"></div>
            <div class="hero-item"><img src="./assets/main2.png"></div>
        </div>
        <div class="hero-overlay">
            <h1 class="hero-names">류승건 & 이지연</h1>
            <p class="hero-date">2026년 8월 15일<br>토요일 오후 12시</p>
        </div>
    </div>

    <div class="h-divider"></div>

    <section class="section">
        <span class="section-title">Invitation</span>
        <p>곁에 있을 때 가장 나다워지는 사람을 만났습니다.<br>서로의 결을 닮아가는 사랑으로 함께할 새날의 시작을 약속합니다.</p>
    </section>

    <div class="h-divider"></div>

    <section class="section" id="gallerySection">
        <span class="section-title">Gallery</span>
        <div class="gallery-wrap limited" id="galleryWrap">
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
        <button id="moreBtn" class="btn-point" style="max-width: 200px; margin: 20px auto;" onclick="toggleGallery()">사진 더보기</button>
    </section>

    <div class="h-divider"></div>

    <section class="section">
        <span class="section-title">Account</span>
        <button onclick="document.getElementById('accModal').style.display='flex'" class="btn-point" style="max-width: 300px; margin: 0 auto;">마음 전하실 곳</button>
    </section>

    <div class="h-divider"></div>

    <section class="section">
        <span class="section-title">Guestbook</span>
        <div class="gb-card">
            <input type="text" id="gb_name" placeholder="성함">
            <textarea id="gb_msg" rows="3" placeholder="축하 메시지를 남겨주세요"></textarea>
            <button onclick="saveGuestMessage()" class="btn-point">메시지 남기기</button>
            <div id="gb-list"></div>
        </div>
    </section>

    <div id="accModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('accModal').style.display='none'" style="float:right; cursor:pointer;">×</span>
            <h3>마음 전하실 곳</h3>
            <div class="acc-group">
                <p>신랑 류승건</p>
                <div class="acc-row"><span id="acc-groom">우리은행 1002-841-241285</span><button class="btn-copy-sm" onclick="copyToClipboard('acc-groom')">복사</button></div>
                <a href="https://qr.kakaopay.com/FNfa3PrZO" class="btn-kakaopay">카카오페이 송금</a>
            </div>
            <div class="acc-group">
                <p>신부 이지연</p>
                <div class="acc-row"><span id="acc-bride">새마을금고 9003-1978-4884-1</span><button class="btn-copy-sm" onclick="copyToClipboard('acc-bride')">복사</button></div>
                <a href="https://qr.kakaopay.com/Ej8bBn70Q" class="btn-kakaopay">카카오페이 송금</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script>
        // 1. 슬라이더 로직
        let heroIdx = 0;
        function moveSlider(dir) {
            const container = document.getElementById('heroSlider');
            heroIdx = (heroIdx + dir + 3) % 3;
            container.style.transform = `translateX(-${heroIdx * 100}%)`;
        }

        // 2. 갤러리 이미지 로드
        const galleryFiles = ['p01', 'p02', 'p03', 'p04', 'p05', 'p06', 'p11', 'p12', 'p13', 'p14', 'p15', 'p16', 'p17', 'p18', 'p19', 'p20', 'p21', 'p31', 'p32', 'p33', 'p34', 'p35', 'p36', 'p37', 'p39', 'p40', 'p51', 'p52', 'p53', 'p54', 'p56', 'p57', 'p58', 'p61', 'p62', 'p63', 'p64', 'p65'];
        const grid = document.getElementById('galleryGrid');
        galleryFiles.forEach(name => {
            const ext = (name === 'p58') ? '.jpg' : '.png';
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="./assets/p00/${name}${ext}">`;
            grid.appendChild(item);
        });

        function toggleGallery() {
            const wrap = document.getElementById('galleryWrap');
            const btn = document.getElementById('moreBtn');
            wrap.classList.toggle('limited');
            btn.innerText = wrap.classList.contains('limited') ? '사진 더보기' : '사진 접기';
        }

        // 3. 복사 로직
        function copyToClipboard(id) {
            const fullText = document.getElementById(id).innerText;
            const accountNumber = fullText.split(' ').pop();
            navigator.clipboard.writeText(accountNumber).then(() => alert("계좌번호가 복사되었습니다."));
        }

        // 4. Firebase
        const firebaseConfig = { apiKey: "AIzaSyD1LmVHTLYnecokZV67_hCDcM289fl3oiw", authDomain: "sg-jy-233e2.firebaseapp.com", databaseURL: "https://sg-jy-233e2-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "sg-jy-233e2", storageBucket: "sg-jy-233e2.firebasestorage.app", messagingSenderId: "217599075354", appId: "1:217599075354:web:c227474b5efc4fd280dda3" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function saveGuestMessage() {
            const name = document.getElementById('gb_name').value.trim();
            const msg = document.getElementById('gb_msg').value.trim();
            if(!name || !msg) return alert("내용을 입력하세요");
            database.ref('guestbook').push({ name, message: msg, timestamp: Date.now() });
            document.getElementById('gb_name').value = '';
            document.getElementById('gb_msg').value = '';
        }
    </script>
</body>
</html>
